<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Salesforce REST POC</title>
 <style>
   :root {
     --app-navy: #29335c;
     --app-navy-soft: #4a587e;
     --app-surface: #f5f7fb;
     --app-panel: #ffffff;
     --app-border: #dfe3ef;
     --app-shadow: rgba(41, 51, 92, 0.08);
     --app-muted: #5f6d8d;
   }

   body {
     margin: 24px;
     font: 16px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
     background: var(--app-surface);
     color: var(--app-navy);
   }

  h1 {
    margin: 0 0 12px;
    color: var(--app-navy);
    font-size: 2rem;
  }

  p {
    color: var(--app-muted);
    margin: 8px 0;
  }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--app-navy);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 16px var(--app-shadow);
    transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  button:hover:not(:disabled) {
    background: var(--app-navy-soft);
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.7;
    cursor: wait;
    box-shadow: none;
  }

  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #edf1f8;
    border: 1px solid var(--app-border);
    border-radius: 10px;
    color: var(--app-navy);
    padding: 16px;
    margin-top: 16px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 1200px;
    margin-top: 16px;
    background: var(--app-panel);
    border: 1px solid var(--app-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px var(--app-shadow);
  }

  th, td {
    border: 1px solid var(--app-border);
    padding: 10px 12px;
    text-align: left;
    vertical-align: top;
  }

  th {
    background: #edf2ff;
    color: var(--app-navy);
    font-weight: 700;
  }

  td {
    background: #fff;
    color: var(--app-navy);
  }

  .status {
    margin: 12px 0 16px;
    font-weight: 600;
    color: var(--app-navy);
  }
 </style>
</head>
<body>
 <h1>Salesforce REST POC</h1>
 <p id="origin"></p>
 <p id="note"></p>
 <div class="status" id="status">Loading Salesforce user data...</div>
 <button id="run" type="button">Refresh Salesforce users</button>
 <div id="result"></div>
 <script>
 // Keep Salesforce secrets out of source control. Inject these values at runtime
 // from a secure backend or deployment config, never by hardcoding them here.
 const SF_CONFIG = window.__SF_CONFIG__ || {};
 const SF_INSTANCE_URL = SF_CONFIG.instanceUrl || '';
 const SF_TOKEN_URL = SF_CONFIG.tokenUrl || '/api/salesforce/token';
 const SOQL =
   'SELECT Id, Name, Username, Email FROM User LIMIT 100';
 const CLIENT_ID = SF_CONFIG.clientId || null;
 const CLIENT_SECRET = SF_CONFIG.clientSecret || null;

 const runButton = document.getElementById('run');
 const status = document.getElementById('status');
 const result = document.getElementById('result');

 document.getElementById('origin').textContent =
   `Page origin: ${window.location.origin}`;

 if (window.location.protocol === 'file:') {
   document.getElementById('note').textContent =
     'This page is running from file://. A Salesforce CORS failure is expected.';
 }

 function setBusy(isBusy) {
   runButton.disabled = isBusy;
   runButton.textContent = isBusy ? 'Loading...' : 'Refresh Salesforce users';
 }

 function renderUsersTable(records) {
   if (!Array.isArray(records) || records.length === 0) {
     result.innerHTML = '<p>No users returned.</p>';
     return;
   }

   const columns = ['Id', 'Name', 'Username', 'Email'];

   const rowsHtml = records
     .map((record) => {
       return `
         <tr>
           <td>${record.Id || ''}</td>
           <td>${record.Name || ''}</td>
           <td>${record.Username || ''}</td>
           <td>${record.Email || ''}</td>
         </tr>
       `;
     })
     .join('');

   result.innerHTML = `
     <table>
       <thead>
         <tr>
           ${columns.map((column) => `<th>${column}</th>`).join('')}
         </tr>
       </thead>
       <tbody>
         ${rowsHtml}
       </tbody>
     </table>
   `;
 }

 async function fetchSalesforceToken() {
   // Preferred pattern: ask a backend endpoint to exchange the credentials securely.
   // The browser should never have the Salesforce client secret.
   if (SF_TOKEN_URL && SF_TOKEN_URL !== '' && !SF_TOKEN_URL.includes('salesforce.com/services/oauth2/token')) {
     const response = await fetch(SF_TOKEN_URL, {
       method: 'POST',
       credentials: 'same-origin',
       cache: 'no-store',
       headers: {
         Accept: 'application/json',
         'Content-Type': 'application/json'
       }
     });

     const rawBody = await response.text();
     let parsedBody = null;

     try {
       parsedBody = JSON.parse(rawBody);
     } catch (_) {
       parsedBody = rawBody;
     }

     if (!response.ok) {
       const detail = typeof parsedBody === 'object' && parsedBody && parsedBody.error
         ? `${parsedBody.error}: ${parsedBody.error_description || ''}`
         : rawBody;
       throw new Error(detail || `Token request failed with HTTP ${response.status}`);
     }

     const token = parsedBody && parsedBody.access_token ? parsedBody.access_token : null;
     if (!token) {
       throw new Error('No access_token returned by the token endpoint.');
     }

     return token;
   }

   if (!CLIENT_ID || !CLIENT_SECRET || !SF_INSTANCE_URL) {
     throw new Error('Missing secure Salesforce config. Set window.__SF_CONFIG__ or provide a backend token endpoint.');
   }

   const body = new URLSearchParams({
     grant_type: 'client_credentials',
     client_id: CLIENT_ID,
     client_secret: CLIENT_SECRET
   });

   const response = await fetch(`${SF_INSTANCE_URL}/services/oauth2/token`, {
     method: 'POST',
     mode: 'cors',
     credentials: 'omit',
     cache: 'no-store',
     referrerPolicy: 'no-referrer',
     headers: {
       'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
       Accept: 'application/json'
     },
     body: body.toString()
   });

   const rawBody = await response.text();
   let parsedBody = null;

   try {
     parsedBody = JSON.parse(rawBody);
   } catch (_) {
     parsedBody = rawBody;
   }

   if (!response.ok) {
     const detail = typeof parsedBody === 'object' && parsedBody && parsedBody.error
       ? `${parsedBody.error}: ${parsedBody.error_description || ''}`
       : rawBody;
     throw new Error(detail || `Token request failed with HTTP ${response.status}`);
   }

   const token = parsedBody && parsedBody.access_token ? parsedBody.access_token : null;
   if (!token) {
     throw new Error('No access_token returned by Salesforce token endpoint.');
   }

   return token;
 }

 async function loadUsers() {
   setBusy(true);
   status.textContent = 'Requesting access token from Salesforce...';
   result.innerHTML = '';

   try {
     const token = await fetchSalesforceToken();
     status.textContent = 'Token received. Fetching User records...';

     const url = new URL('/services/data/v65.0/query', SF_INSTANCE_URL);
     url.searchParams.set('q', SOQL);

     const response = await fetch(url.toString(), {
       method: 'GET',
       mode: 'cors',
       credentials: 'omit',
       cache: 'no-store',
       referrerPolicy: 'no-referrer',
       headers: {
         Authorization: `Bearer ${token}`,
         Accept: 'application/json'
       }
     });

     const rawBody = await response.text();
     let parsedBody = null;

     try {
       parsedBody = JSON.parse(rawBody);
     } catch (_) {
       parsedBody = rawBody;
     }

     if (!response.ok) {
       const detail = typeof parsedBody === 'object' && parsedBody && parsedBody.message
         ? parsedBody.message
         : rawBody;
       throw new Error(detail || `Query failed with HTTP ${response.status}`);
     }

     const records = parsedBody && Array.isArray(parsedBody.records) ? parsedBody.records : [];
     renderUsersTable(records);
     status.textContent = `Loaded ${records.length} User records successfully.`;
   } catch (error) {
     status.textContent = `Error: ${error.message}`;
     result.innerHTML = `<pre>${error.message}</pre>`;
   } finally {
     setBusy(false);
   }
 }

 runButton.addEventListener('click', loadUsers);
 window.addEventListener('DOMContentLoaded', loadUsers);
 </script>
</body>
</html>
