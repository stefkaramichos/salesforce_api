<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Salesforce Bridge</title>
  </head>
  <body>
    <script>
      // Notify the plugin that the bridge is ready.
      window.parent.postMessage({ type: 'agentforce-bridge-ready' }, '*');

      function parseBody(value) {
        if (value === undefined || value === null) return value;
        if (typeof value === 'string') {
          try {
            return JSON.parse(value);
          } catch (error) {
            return value;
          }
        }
        return value;
      }

      function buildTargetUrl(instanceUrl, path) {
        if (!instanceUrl) return null;
        const base = String(instanceUrl).replace(/\/+$/, '');
        const incoming = String(path || '/');
        if (/^https?:\/\//i.test(incoming)) return incoming;
        return `${base}${incoming.startsWith('/') ? incoming : `/${incoming}`}`;
      }

      function sendResult(id, ok, payload, error) {
        window.parent.postMessage({
          type: 'agentforce-response',
          id,
          ok,
          payload,
          error: error ? (error.message || String(error)) : undefined
        }, '*');
      }

      window.addEventListener('message', async function (event) {
        const msg = event.data || {};
        if (msg.type !== 'agentforce-request') return;

        const requestId = msg.id;
        const method = (msg.method || 'GET').toUpperCase();
        const token = msg.token || msg.access_token || msg.accessToken;
        const instanceUrl = msg.instanceUrl || msg.instance_url || msg.instanceURL;
        const path = msg.path || msg.endpoint || '/';
        const body = parseBody(msg.body);
        const headers = Object.assign({}, msg.headers || {});

        if (!token) {
          sendResult(requestId, false, null, new Error('Missing access token.'));
          return;
        }

        if (!instanceUrl) {
          sendResult(requestId, false, null, new Error('Missing Salesforce instance URL.'));
          return;
        }

        const targetUrl = buildTargetUrl(instanceUrl, path);
        if (!targetUrl) {
          sendResult(requestId, false, null, new Error('Invalid Salesforce target URL.'));
          return;
        }

        try {
          const requestHeaders = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/json',
            ...headers
          };

          let payload = body;
          if (payload !== undefined && payload !== null && typeof payload !== 'string' && !(payload instanceof FormData)) {
            requestHeaders['Content-Type'] = requestHeaders['Content-Type'] || 'application/json';
            payload = JSON.stringify(payload);
          }

          const response = await fetch(targetUrl, {
            method,
            headers: requestHeaders,
            body: payload !== undefined && payload !== null && method !== 'GET' && method !== 'HEAD' ? payload : undefined,
            credentials: 'omit'
          });

          const rawText = await response.text();
          let parsedResponse = null;
          try {
            parsedResponse = rawText ? JSON.parse(rawText) : null;
          } catch (error) {
            parsedResponse = rawText;
          }

          if (!response.ok) {
            const message =
              (parsedResponse && (parsedResponse.message || parsedResponse.error_description || parsedResponse.error)) ||
              rawText ||
              `Request failed with HTTP ${response.status}`;
            throw new Error(message);
          }

          sendResult(requestId, true, {
            status: response.status,
            statusText: response.statusText,
            body: parsedResponse
          }, null);
        } catch (error) {
          sendResult(requestId, false, null, error);
        }
      });
    </script>
  </body>
</html>
