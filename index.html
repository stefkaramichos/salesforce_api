<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Salesforce REST POC</title>
 <style>
 body { font: 16px system-ui, sans-serif; margin: 24px; }
 button { padding: 10px 18px; }
 pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #eee; padding: 16px; }
 table { border-collapse: collapse; width: 100%; max-width: 1200px; margin-top: 16px; }
 th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: top; }
 th { background: #f3f3f3; }
 .status { margin-bottom: 12px; }
 </style>
</head>
<body>
 <h1>Salesforce REST POC</h1>
 <p id="origin"></p>
 <p id="note"></p>
 <div class="status" id="status">Loading Salesforce user data...</div>
 <button id="run" type="button">Refresh Salesforce users</button>
 <div id="result"></div>
 <script>
 const SF_INSTANCE_URL =
   'https://sz-scout01--crmr18dev.sandbox.my.salesforce.com';
 const SF_TOKEN_URL =
   'https://sz-scout01--crmr18dev.sandbox.my.salesforce.com/services/oauth2/token';
 const SOQL =
   'SELECT Id, Name, Username, Email FROM User LIMIT 100';
 const CLIENT_ID =
   '3MVG9VwL6uEwP_uTvj6NWrKg3PCiyZFdzyeOfUIfiFf2YzELXZA_OH6KhEBT3XPz.rOjyTGjU_DM7oZAxsHAV';
 const CLIENT_SECRET =
   '7CBCF02876DD3453B8A415892BC0F358A60B25D16DD29D36CC634CA9D0E1E535';

 const runButton = document.getElementById('run');
 const status = document.getElementById('status');
 const result = document.getElementById('result');

 document.getElementById('origin').textContent =
   `Page origin: ${window.location.origin}`;

 if (window.location.protocol === 'file:') {
   document.getElementById('note').textContent =
     'This page is running from file://. A Salesforce CORS failure is expected.';
 }

 function setBusy(isBusy) {
   runButton.disabled = isBusy;
   runButton.textContent = isBusy ? 'Loading...' : 'Refresh Salesforce users';
 }

 function renderUsersTable(records) {
   if (!Array.isArray(records) || records.length === 0) {
     result.innerHTML = '<p>No users returned.</p>';
     return;
   }

   const columns = ['Id', 'Name', 'Username', 'Email'];

   const rowsHtml = records
     .map((record) => {
       return `
         <tr>
           <td>${record.Id || ''}</td>
           <td>${record.Name || ''}</td>
           <td>${record.Username || ''}</td>
           <td>${record.Email || ''}</td>
         </tr>
       `;
     })
     .join('');

   result.innerHTML = `
     <table>
       <thead>
         <tr>
           ${columns.map((column) => `<th>${column}</th>`).join('')}
         </tr>
       </thead>
       <tbody>
         ${rowsHtml}
       </tbody>
     </table>
   `;
 }

 async function fetchSalesforceToken() {
   const body = new URLSearchParams({
     grant_type: 'client_credentials',
     client_id: CLIENT_ID,
     client_secret: CLIENT_SECRET
   });

   const response = await fetch(SF_TOKEN_URL, {
     method: 'POST',
     mode: 'cors',
     credentials: 'omit',
     cache: 'no-store',
     referrerPolicy: 'no-referrer',
     headers: {
       'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
       Accept: 'application/json'
     },
     body: body.toString()
   });

   const rawBody = await response.text();
   let parsedBody = null;

   try {
     parsedBody = JSON.parse(rawBody);
   } catch (_) {
     parsedBody = rawBody;
   }

   if (!response.ok) {
     const detail = typeof parsedBody === 'object' && parsedBody && parsedBody.error
       ? `${parsedBody.error}: ${parsedBody.error_description || ''}`
       : rawBody;
     throw new Error(detail || `Token request failed with HTTP ${response.status}`);
   }

   const token = parsedBody && parsedBody.access_token ? parsedBody.access_token : null;
   if (!token) {
     throw new Error('No access_token returned by Salesforce token endpoint.');
   }

   return token;
 }

 async function loadUsers() {
   setBusy(true);
   status.textContent = 'Requesting access token from Salesforce...';
   result.innerHTML = '';

   try {
     const token = await fetchSalesforceToken();
     status.textContent = 'Token received. Fetching User records...';

     const url = new URL('/services/data/v65.0/query', SF_INSTANCE_URL);
     url.searchParams.set('q', SOQL);

     const response = await fetch(url.toString(), {
       method: 'GET',
       mode: 'cors',
       credentials: 'omit',
       cache: 'no-store',
       referrerPolicy: 'no-referrer',
       headers: {
         Authorization: `Bearer ${token}`,
         Accept: 'application/json'
       }
     });

     const rawBody = await response.text();
     let parsedBody = null;

     try {
       parsedBody = JSON.parse(rawBody);
     } catch (_) {
       parsedBody = rawBody;
     }

     if (!response.ok) {
       const detail = typeof parsedBody === 'object' && parsedBody && parsedBody.message
         ? parsedBody.message
         : rawBody;
       throw new Error(detail || `Query failed with HTTP ${response.status}`);
     }

     const records = parsedBody && Array.isArray(parsedBody.records) ? parsedBody.records : [];
     renderUsersTable(records);
     status.textContent = `Loaded ${records.length} User records successfully.`;
   } catch (error) {
     status.textContent = `Error: ${error.message}`;
     result.innerHTML = `<pre>${error.message}</pre>`;
   } finally {
     setBusy(false);
   }
 }

 runButton.addEventListener('click', loadUsers);
 window.addEventListener('DOMContentLoaded', loadUsers);
 </script>
</body>
</html>
